name: ShortsFactory CI

on:
  push:
    branches: [ main, master, 'roadmap-12-fases' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-build-lint:
    name: Unit tests, lint and release validation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Show installed Android SDK packages
        run: sdkmanager --list_installed

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify bundled FFmpeg checksums
        run: sha256sum -c tools/ffmpeg-binary/SHA256SUMS

      # :domain é um módulo Kotlin/JVM puro: lá a task é `test`. `testDebugUnitTest` só existe nos módulos Android,
      # então rodar apenas ela deixaria os testes de pipeline/seleção/score do domain fora do CI.
      - name: Run all JVM unit tests
        run: ./gradlew :domain:test testDebugUnitTest --stacktrace --no-daemon --max-workers=2

      - name: Run debug lint
        run: ./gradlew lintDebug --stacktrace --no-daemon --max-workers=2

      - name: Assemble debug, release and Android test APKs
        run: ./gradlew assembleDebug assembleRelease :app:assembleDebugAndroidTest :data:assembleDebugAndroidTest --stacktrace --no-daemon --max-workers=2

      - name: Upload test, lint and APK reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-lint-build-reports
          if-no-files-found: ignore
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/lint-results-*.html
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk

  instrumented:
    name: Instrumented Android tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: unit-build-lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Room migration checks on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-spellchecker: true
          script: ./gradlew :data:connectedDebugAndroidTest --stacktrace --no-daemon --max-workers=2

      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          if-no-files-found: ignore
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
            **/build/outputs/code_coverage/**
